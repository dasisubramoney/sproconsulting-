# Netlify configuration for sproconsulting.co.za
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ---------------------------------------------------------------------------
# Security headers (all routes)
#
# CSP notes:
# - style-src is 'self' only — no 'unsafe-inline' needed:
#   * Pages are pre-rendered, and the build fails if any page contains a
#     style="" attribute or inline <script> (scripts/prerender.mjs).
#   * At runtime, Framer Motion and GSAP write styles through the CSSOM
#     (element.style), which CSP does not block.
#   * Avoid AnimatePresence mode="popLayout" (it injects a <style> tag).
# - JSON-LD <script type="application/ld+json"> is a data block, not executed,
#   so script-src 'self' does not affect it.
# - frame-src allows OpenStreetMap only, for the click-to-load map on /contact.
# - If Netlify reCAPTCHA is enabled later, add https://www.google.com and
#   https://www.gstatic.com to script-src and frame-src.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    # TODO: only submit to hstspreload.org once every subdomain serves HTTPS.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build assets never change — cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so new deploys are picked up immediately.
# (SPA routes rewritten to index.html already get Netlify's default
#  "public, max-age=0, must-revalidate".)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Domain
# HTTPS is enforced by Netlify automatically. For apex <-> www, set the
# primary domain in Netlify > Domain management; Netlify then 301s the other.
# TODO: confirm apex (sproconsulting.co.za) vs www as canonical.
# Manual alternative if needed:
# [[redirects]]
#   from = "https://www.sproconsulting.co.za/*"
#   to = "https://sproconsulting.co.za/:splat"
#   status = 301
#   force = true
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 301s from the old Adobe Muse site (2018).
# TODO: cross-check against the live site's full URL list / Search Console
# before DNS cut-over.
# ---------------------------------------------------------------------------

# /index.html and /services.html are not redirected: both are real pre-rendered
# files now, so a forced rule risks a loop. Netlify serves them at / and /services,
# and the canonical tag covers the duplicate URL. TODO: verify on deploy preview.

[[redirects]]
  from = "/about-us.html"
  to = "/about"
  status = 301
  force = true

